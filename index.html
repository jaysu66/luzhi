<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f4eee2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="录制台">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>录制台</title>
<style>
:root{
  --bg:#f4eee2;--surface:#fffcf5;--band:#efe7d8;--line:#e2d9c8;--line2:#cdbfa8;
  --ink:#2e2a26;--ink2:#5a544c;--ink3:#6b655d;
  --accent:#c24e3a;--accent-ink:#a8402e;--accent-bg:#f7e3dd;
  --v:#d08622;--v-ink:#8f5a12;--v-bg:#f8e9d2;
  --d:#2f7fa8;--d-ink:#1f5f80;--d-bg:#ddecf4;
  --u:#4f934f;--u-ink:#36703a;--u-bg:#e1efdf;
  --sans:"PingFang SC","HarmonyOS Sans SC","MiSans","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong",var(--sans);
  --ease:cubic-bezier(.2,0,0,1);
  --cue:22px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.7 var(--sans);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}

/* 锁屏 */
#lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
#lock form{width:100%;max-width:360px}
#lock h1{font:500 32px/1.2 var(--serif);letter-spacing:-.02em;margin:0 0 8px}
#lock p{margin:0 0 24px;color:var(--ink2)}
#lock input{width:100%;height:48px;padding:0 16px;border:1px solid var(--line2);border-radius:6px;background:var(--surface);font-size:17px}
#lock input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-bg)}
#lock .err{color:var(--accent-ink);font-size:14px;min-height:24px;margin:8px 0 8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:6px;border:1px solid var(--line2);background:var(--surface);cursor:pointer;font-weight:500;font-size:15px;text-decoration:none;transition:background-color .12s var(--ease),transform .12s var(--ease)}
.btn:hover{background:var(--band)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-ink)}
.btn.block{width:100%}

/* 顶栏 */
.bar{position:sticky;top:0;z-index:5;background:rgba(244,238,226,.96);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:8px;height:52px}
.back{flex:none;white-space:nowrap;min-width:44px;min-height:44px;display:inline-flex;align-items:center;gap:4px;border:0;background:none;padding:0 8px 0 0;cursor:pointer;color:var(--ink2);font-size:15px}
.back:hover{color:var(--ink)}
.bar .t{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;border-top:1px solid var(--line)}
.tabs a{flex:1;min-height:44px;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:15px;font-weight:500;color:var(--ink3);border-bottom:2px solid transparent}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current=page]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}

main{padding:24px 0 96px}
.fade{animation:fade .2s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.eyebrow{font-size:13px;font-weight:600;letter-spacing:.06em;color:var(--ink3);margin:0 0 8px}
h1.home{font:500 32px/1.2 var(--serif);letter-spacing:-.02em;margin:0 0 24px}
h3.sec{font-size:13px;font-weight:600;letter-spacing:.06em;color:var(--ink3);margin:48px 0 12px}

/* 首页 */
.next{display:block;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px 16px;box-shadow:0 1px 2px rgba(0,0,0,.04);transition:border-color .12s var(--ease)}
.next:hover{border-color:var(--line2)}
.next h2{font:600 22px/1.35 var(--serif);margin:12px 0 8px}
.next .one{margin:0 0 16px;color:var(--ink2);font-size:15px}
.next .go{font-weight:600;color:var(--accent-ink);font-size:15px}
.meta{font-size:13px;color:var(--ink3)}
.chip{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:6px;font-size:13px;font-weight:600;white-space:nowrap;vertical-align:1px}
.chip.ok{background:var(--u-bg);color:var(--u-ink)}
.chip.todo{background:var(--band);color:var(--ink2)}
.chip.wait{background:#fbf1dc;color:#7d4f0a}
.queue{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.queue li{border-bottom:1px solid var(--line)}
.queue a,.queue div.row{display:flex;gap:12px;align-items:flex-start;padding:12px 0;text-decoration:none;min-height:44px}
.queue .qt{font-weight:500}
.queue .qn{display:block;font-size:13px;color:var(--ink3);line-height:1.5;margin-top:4px}
.foot{margin-top:48px;font-size:13px;color:var(--ink3)}

/* 问题链 */
.chain{list-style:none;margin:0 0 32px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.chain .cap{font-size:13px;font-weight:600;color:var(--ink3);letter-spacing:.04em;margin:0 0 12px}
.chain ol{list-style:none;margin:0;padding:0;counter-reset:q}
.chain li{position:relative;padding:0 0 12px 32px;counter-increment:q;font-weight:500}
.chain li:last-child{padding-bottom:0}
.chain li::before{content:counter(q);position:absolute;left:0;top:2px;width:22px;height:22px;border-radius:50%;background:var(--accent-bg);color:var(--accent-ink);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center}
.chain li::after{content:"";position:absolute;left:10.5px;top:26px;bottom:2px;border-left:1px solid var(--line2)}
.chain li:last-child::after{display:none}

/* 导图 */
.mmbar{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px}
.mmbar .cap{font-size:13px;font-weight:600;color:var(--ink3);letter-spacing:.04em}
.mmbar button{min-height:44px;border:0;background:none;color:var(--ink2);font-size:14px;font-weight:500;cursor:pointer;padding:0 4px}
.mmbar button:hover{color:var(--ink)}
.root{background:var(--accent-bg);border-left:3px solid var(--accent);border-radius:6px;padding:12px 16px;font:600 18px/1.55 var(--serif);margin-bottom:4px}
.mm,.mm ul{list-style:none;margin:0;padding:0}
.mm{margin-left:12px;padding-left:0}
.mm li{position:relative;padding:8px 0 0 20px}
.mm li::before{content:"";position:absolute;left:0;top:0;bottom:0;border-left:1.5px solid var(--line2)}
.mm li:last-child::before{bottom:auto;height:28px}
.mm li::after{content:"";position:absolute;left:0;top:28px;width:14px;border-top:1.5px solid var(--line2)}
.mm ul{margin-left:12px}
.mm li.l1::after{top:30px}.mm li.l1:last-child::before{height:30px}
.mm li.l3::after,.mm li.l4::after{top:25px}.mm li.l3:last-child::before,.mm li.l4:last-child::before{height:25px}
.node{display:inline-flex;align-items:flex-start;gap:8px;max-width:100%;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 12px;font-size:15px;line-height:1.5;text-align:left}
button.node{cursor:pointer;min-height:44px;align-items:center;transition:border-color .12s var(--ease)}
button.node:hover{border-color:var(--line2)}
.node .tx{flex:1}
.node .cnt{flex:none;font-size:12px;font-weight:600;color:var(--ink3);background:var(--band);border-radius:6px;padding:0 6px;line-height:20px;margin-top:1px}
.l1>.node{font-size:16px;font-weight:600;border-color:var(--line2);padding:10px 12px}
.l1>.node .seg{display:block;font-size:12px;font-weight:500;color:var(--ink3);margin-top:2px}
.l3>.node,.l4>.node{font-size:14.5px;background:transparent;border-color:transparent;border-bottom-color:var(--line);border-radius:0;padding:6px 4px}
.node b{font-weight:600}
.node.v{background:var(--v-bg);border-color:#ecd2a8}
.node.d{background:var(--d-bg);border-color:#bcd9ea}
.node.u{background:var(--u-bg);border-color:#c3dfc0}
.node.turn{border-color:var(--accent);background:var(--surface)}
.collapsed>ul{display:none}
.tag{display:inline;padding:1px 6px;border-radius:6px;font-weight:600;white-space:nowrap}
.tag.v{background:var(--v-bg);color:var(--v-ink)}
.tag.d{background:var(--d-bg);color:var(--d-ink)}
.tag.u{background:var(--u-bg);color:var(--u-ink)}
.node.v .tag,.node.d .tag,.node.u .tag{background:transparent;padding:0}
.turnchip{display:inline-block;font-size:12px;font-weight:600;color:#fff;background:var(--accent);border-radius:6px;padding:0 6px;line-height:20px;margin-right:6px;vertical-align:1px}
mark.you{background:#fbf1dc;color:#7d4f0a;border-radius:4px;padding:0 4px;font-weight:600}

/* 提词 */
.before{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:24px}
.before .cap{font-size:13px;font-weight:600;color:var(--ink3);letter-spacing:.04em;margin:0 0 8px}
.before ul{margin:0;padding-left:20px}
.before li{margin:4px 0}
.copyrow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.copyrow .primary{flex:1 1 220px}
.hint{font-size:13px;color:var(--ink3);margin:0 0 24px}
.cue{border-top:1px solid var(--line);padding:24px 0}
.cue h3{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:15px;font-weight:600;margin:0 0 4px}
.cue .ask{font-size:14px;color:var(--ink2);margin:0 0 12px}
.cue .big{font-size:var(--cue);line-height:1.6;font-weight:500;margin:0}
.cue .big span{display:block;margin-bottom:8px}
.cue .big span:last-child{margin-bottom:0}
.chip.say{background:var(--accent-bg);color:var(--accent-ink)}
.sizes{display:flex;gap:8px}
.sizes .btn{min-width:44px;padding:0 12px}

/* 全稿 */
.seg{scroll-margin-top:110px}
.script{border-top:1px solid var(--line);padding:24px 0}
.script h3{font:600 19px/1.4 var(--serif);margin:0 0 4px}
.script .shot{font-size:13px;color:var(--ink3);margin:0 0 12px}
.script p.s{margin:0 0 12px;font-size:17px;line-height:1.8}
details{border:1px solid var(--line);border-radius:6px;background:var(--surface);margin-top:12px}
summary{cursor:pointer;min-height:44px;display:flex;align-items:center;padding:0 12px;font-size:14px;font-weight:600;color:var(--ink2);list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";margin-left:auto;color:var(--ink3);font-weight:500}
details[open] summary::after{content:"−"}
details .in{padding:0 12px 12px;font-size:14.5px;color:var(--ink2);line-height:1.7}

/* 自查 */
.qa{list-style:none;margin:0;padding:0}
.qa li{margin-bottom:8px}
.qa button{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;min-height:44px;transition:border-color .12s var(--ease)}
.qa button:hover{border-color:var(--line2)}
.qa .q{font-weight:600;display:block}
.qa .a{display:block;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);color:var(--ink2);font-size:15px}
.qa .tap{display:block;margin-top:4px;font-size:13px;color:var(--ink3)}
.progress{font-size:13px;color:var(--ink3);margin:0 0 16px}

/* 为什么 */
.card3{border-radius:12px;padding:16px;margin-bottom:8px;border:1px solid var(--line)}
.card3.v{background:var(--v-bg);border-color:#ecd2a8}
.card3.d{background:var(--d-bg);border-color:#bcd9ea}
.card3.u{background:var(--u-bg);border-color:#c3dfc0}
.card3 h4{margin:0 0 8px;font-size:17px}
.card3.v h4{color:var(--v-ink)}.card3.d h4{color:var(--d-ink)}.card3.u h4{color:var(--u-ink)}
.card3 dl{margin:0;font-size:15px}
.card3 dt{color:var(--ink3);font-size:13px;font-weight:500}
.card3 dd{margin:0 0 8px}
.card3 dd:last-child{margin-bottom:0}
.whylist{list-style:none;margin:0;padding:0}
.whylist li{border-top:1px solid var(--line);padding:16px 0}
.whylist b{display:block;margin-bottom:4px}
.whylist p{margin:0;font-size:15px;color:var(--ink2)}
.plain{font-size:15px;color:var(--ink2)}
.plain ul{padding-left:20px;margin:0}
.src{font-size:12px;color:var(--ink3);word-break:break-all;margin-top:48px}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,8px);background:var(--ink);color:#fff;padding:8px 16px;border-radius:6px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .15s var(--ease),transform .15s var(--ease);z-index:9}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (min-width:768px){
  main{padding-top:32px}
  h1.home{font-size:40px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div id="lock">
  <form id="lockform" autocomplete="on">
    <h1>录制台</h1>
    <p>输入密码打开。这台手机记住后，下次不用再输。</p>
    <input id="pw" type="password" name="password" autocomplete="current-password" placeholder="密码" aria-label="密码" required>
    <div class="err" id="err" role="alert"></div>
    <button class="btn primary block" id="unlock" type="submit">打开</button>
  </form>
</div>
<div id="app" hidden>
  <header class="bar" id="bar"></header>
  <main><div class="wrap" id="view"></div></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

const KEY = "luzhi-pw";
let D = null;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const K3 = {"值":"v","对":"d","用":"u"};

// 行内标记：[值]xx → 三件事色块；{转折} → 朱红小标；〔…〕→ 要本人自己说的地方
function ink(s){
  let h = esc(s);
  h = h.replace(/\{转折\}/g, '<span class="turnchip">转折</span>');
  h = h.replace(/\[(值|对|用)\]([^：:（(／，。、；\s→]*)/g, (m, k, t) => `<span class="tag ${K3[k]}">${t || k}</span>`);
  h = h.replace(/〔([^〕]*)〕/g, '<mark class="you">〔$1〕</mark>');
  return h;
}
const plain = s => String(s ?? "").replace(/\{转折\}/g, "").replace(/\[(值|对|用)\]/g, "");
function kind(s){ const m = /^\s*\[(值|对|用)\]/.exec(s); return m ? K3[m[1]] : (s.includes("{转折}") ? "turn" : ""); }
function labelled(s){
  const i = s.indexOf("：");
  if (i > 0 && i <= 6 && !s.slice(0, i).includes("[")) return `<b>${ink(s.slice(0, i))}</b>：${ink(s.slice(i + 1))}`;
  return ink(s);
}

function toast(t){ const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), 1600); }
async function copy(text){
  try { await navigator.clipboard.writeText(text); }
  catch(e){ const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
  toast("已复制");
}

// ---------- 解密 ----------
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(P.salt), iterations:P.iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const buf = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(P.iv)}, key, b64(P.ct));
  return JSON.parse(new TextDecoder().decode(buf));
}
async function tryOpen(pw, remember){
  try { D = await decrypt(pw); } catch(e){ return false; }
  if (remember) localStorage.setItem(KEY, pw);
  $("#lock").hidden = true; $("#app").hidden = false;
  route();
  return true;
}
$("#lockform").addEventListener("submit", async e => {
  e.preventDefault();
  const b = $("#unlock"); b.disabled = true; b.textContent = "正在打开…"; $("#err").textContent = "";
  const ok = await tryOpen($("#pw").value.trim(), true);
  if (!ok){ $("#err").textContent = "密码不对，再试一次。"; b.disabled = false; b.textContent = "打开"; $("#pw").select(); }
});

// ---------- 路由 ----------
const TABS = [["map","导图"],["cue","提词"],["script","全稿"],["check","自查"],["why","为什么"]];
function route(){
  if (!D) return;
  const [, id, tab] = location.hash.replace(/^#\/?/, "#/").split("/");
  const t = D.topics.find(x => x.id === id);
  if (!t){ home(); return; }
  topic(t, TABS.some(x => x[0] === tab) ? tab : "map");
}
window.addEventListener("hashchange", () => { route(); window.scrollTo(0, 0); });

function bar(html){ $("#bar").innerHTML = html; }
function view(html){ const v = $("#view"); v.innerHTML = html; v.classList.remove("fade"); void v.offsetWidth; v.classList.add("fade"); }

function statusChip(s){
  const c = s === "能录" ? "ok" : s === "等你点头" ? "wait" : "todo";
  return `<span class="chip ${c}">${esc(s)}</span>`;
}

function home(){
  bar(`<div class="wrap"><span class="t">录制台</span></div>`);
  const next = D.topics.find(t => t.status === "能录") || D.topics[0];
  let h = `<p class="eyebrow">今天录这条</p>`;
  if (next){
    h += `<a class="next" href="#/${next.id}/map">
      <div>${statusChip(next.status)} <span class="meta">${esc(next.short)} · ${esc(next.length)}</span></div>
      <h2>${esc(next.title)}</h2>
      <p class="one">${ink(next.oneLine)}</p>
      <span class="go">先看导图，再看提词 →</span></a>`;
  }
  h += `<h3 class="sec">这一批</h3><ol class="queue">`;
  for (const q of D.queue){
    const inner = `${statusChip(q.status)}<span><span class="qt">${esc(q.title)}</span><span class="qn">${esc(q.note)}</span></span>`;
    h += `<li>${q.id ? `<a href="#/${q.id}/map">${inner}</a>` : `<div class="row">${inner}</div>`}</li>`;
  }
  h += `</ol><p class="foot">更新于 ${esc(D.built)} · 第一次打开后，没网也能看</p>`;
  view(h);
}

function topic(t, tab){
  bar(`<div class="wrap"><button class="back" onclick="location.hash='#/'" aria-label="回到首页">‹ 录制台</button><span class="t">${esc(t.short)} · ${esc(t.title)}</span></div>
    <nav class="tabs wrap" aria-label="这一条的内容">${TABS.map(([k, n]) => `<a href="#/${t.id}/${k}" ${k === tab ? 'aria-current="page"' : ""}>${n}</a>`).join("")}</nav>`);
  ({map: vMap, cue: vCue, script: vScript, check: vCheck, why: vWhy})[tab](t);
}

// 导图
function tree(nodes, lvl){
  return nodes.map((n, i) => {
    const k = kind(n.text), kids = n.children || [];
    let txt;
    if (lvl === 1){ const [a, b] = n.text.split("｜"); txt = `<span class="tx">${labelled(a)}${b ? `<span class="seg">${esc(b)}</span>` : ""}</span>`; }
    else txt = `<span class="tx">${labelled(n.text)}</span>`;
    const node = kids.length
      ? `<button class="node ${k}" aria-expanded="true" data-n="${kids.length}">${txt}<span class="cnt" aria-hidden="true">−</span></button>`
      : `<div class="node ${k}">${txt}</div>`;
    return `<li class="l${lvl}">${node}${kids.length ? `<ul>${tree(kids, lvl + 1)}</ul>` : ""}</li>`;
  }).join("");
}
function vMap(t){
  view(`<div class="chain"><p class="cap">问题链 · 每段只要记住它回答的问题</p><ol>${t.chain.map(q => `<li>${esc(q)}</li>`).join("")}</ol></div>
    <div class="mmbar"><span class="cap">导图 · 点一下收起或展开</span><button id="fold">只看主干</button></div>
    <div class="root">${ink(t.oneLine)}</div>
    <ul class="mm">${tree(t.mindmap, 1)}</ul>`);
  const setNode = (b, open) => { b.closest("li").classList.toggle("collapsed", !open); b.setAttribute("aria-expanded", open); b.querySelector(".cnt").textContent = open ? "−" : "+" + b.dataset.n; };
  document.querySelectorAll("button.node").forEach(b => b.addEventListener("click", () => setNode(b, b.getAttribute("aria-expanded") !== "true")));
  const f = $("#fold");
  f.addEventListener("click", () => {
    const folding = f.textContent === "只看主干";
    document.querySelectorAll(".l1>button.node").forEach(b => setNode(b, !folding));
    if (!folding) document.querySelectorAll("button.node").forEach(b => setNode(b, true));
    f.textContent = folding ? "全部展开" : "只看主干";
  });
}

// 提词
function cueText(t, full){
  return t.segments.map(s => {
    const head = `${s.no} ${s.name}${s.verbatim ? "（照念）" : ""}`;
    const body = (full || s.verbatim) ? s.script.join("\n") : s.cue.split(/\s*／\s*/).map(plain).join("\n");
    return head + "\n" + body;
  }).join("\n\n");
}
function vCue(t){
  const size = localStorage.getItem("luzhi-cue") || "22";
  document.documentElement.style.setProperty("--cue", size + "px");
  let h = `<div class="before"><p class="cap">录之前</p><ul>${t.before.map(x => `<li>${ink(x)}</li>`).join("")}</ul></div>
    <div class="copyrow"><button class="btn primary" id="cpcue">复制提词，贴进剪映提词器</button>
    <div class="sizes" role="group" aria-label="提词字号"><button class="btn" id="sm" aria-label="字小一点">A−</button><button class="btn" id="lg" aria-label="字大一点">A＋</button></div></div>
    <p class="hint">照念的两段给全文，其他段只给关键词：吃透了用自己的话讲。</p>`;
  for (const s of t.segments){
    const big = s.verbatim ? s.script.map(p => `<span>${ink(p)}</span>`).join("") : s.cue.split(/\s*／\s*/).map(x => `<span>${ink(x)}</span>`).join("");
    h += `<section class="cue"><h3>${esc(s.no)} ${esc(s.name)} <span class="meta">${esc(s.secs)}</span>${s.verbatim ? '<span class="chip say">照念</span>' : ""}</h3>
      <p class="ask">回答：${ink(s.ask)}</p><p class="big">${big}</p></section>`;
  }
  h += `<button class="btn block" id="cpall">复制完整稿</button>`;
  view(h);
  $("#cpcue").onclick = () => copy(cueText(t, false));
  $("#cpall").onclick = () => copy(cueText(t, true));
  const step = d => { const n = Math.max(18, Math.min(32, parseInt(localStorage.getItem("luzhi-cue") || "22") + d)); localStorage.setItem("luzhi-cue", n); document.documentElement.style.setProperty("--cue", n + "px"); };
  $("#sm").onclick = () => step(-2); $("#lg").onclick = () => step(2);
}

// 全稿
function vScript(t){
  let h = "";
  for (const s of t.segments){
    h += `<section class="script seg" id="s${s.no}"><h3>${esc(s.no)} ${esc(s.name)}</h3>
      <p class="shot">${esc(s.secs)}${s.verbatim ? " · 照念" : ""} · 画面：${esc(s.shot)}</p>
      ${s.script.map(p => `<p class="s">${ink(p)}</p>`).join("")}
      <details><summary>这段要讲准</summary><div class="in">${ink(s.careful)}</div></details></section>`;
  }
  view(h);
}

// 自查
function vCheck(t){
  let h = `<p class="progress" id="pg">先自己答，再点开看。已看 0 / ${t.check.length}</p><ol class="qa">`;
  t.check.forEach((c, i) => { h += `<li><button aria-expanded="false" data-i="${i}"><span class="q">${i + 1}. ${ink(c.q)}</span><span class="tap">点开看答案</span><span class="a" hidden>${ink(c.a)}</span></button></li>`; });
  view(h + "</ol>");
  const seen = new Set();
  document.querySelectorAll(".qa button").forEach(b => b.addEventListener("click", () => {
    const open = b.getAttribute("aria-expanded") !== "true";
    b.setAttribute("aria-expanded", open); b.querySelector(".a").hidden = !open; b.querySelector(".tap").hidden = open;
    if (open) seen.add(b.dataset.i);
    $("#pg").textContent = `先自己答，再点开看。已看 ${seen.size} / ${t.check.length}`;
  }));
}

// 为什么
function vWhy(t){
  const [hd, ...rows] = t.summary;
  let h = `<p class="eyebrow">总结卡 · 也是结尾停的那张表</p>`;
  for (const r of rows){
    const k = kind(r[0]);
    h += `<div class="card3 ${k}"><h4>${esc(plain(r[0]))}</h4><dl>${hd.slice(1).map((x, i) => `<dt>${esc(x)}</dt><dd>${ink(r[i + 1])}</dd>`).join("")}</dl></div>`;
  }
  h += `<h3 class="sec">每段为什么这样设计</h3><ul class="whylist">${t.segments.map(s => `<li><b>${esc(s.no)} ${esc(s.name)}</b><p>${ink(s.why)}</p></li>`).join("")}</ul>`;
  h += `<h3 class="sec">画面</h3><div class="plain"><p>${ink(t.form)}</p></div>`;
  if (t.todo.length) h += `<h3 class="sec">发布前还差</h3><div class="plain"><ul>${t.todo.map(x => `<li>${ink(x)}</li>`).join("")}</ul></div>`;
  h += `<p class="src">${esc(t.updated)} · 正本：${esc(t.source)}</p>`;
  view(h);
}

// ---------- 启动 ----------
(async () => {
  const saved = localStorage.getItem(KEY);
  if (saved){ $("#lock").hidden = true; if (await tryOpen(saved, false)) return; $("#lock").hidden = false; }
  $("#pw").focus();
})();
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("sw.js");
</script>
